services:

  # ── Bot backend ───────────────────────────────────────────────────────────────
  backend:
    build: .
    container_name: ${BOT_CONTAINER_NAME:-bot-restaurantes}
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    volumes:
      - ${BACKEND_VOLUME:-backend_data}:/app/data
    depends_on:
      - evolution-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - bot-network

  # ── Evolution API (WhatsApp via Baileys + REST) ──────────────────────────────
  # Imagen custom con patch para soporte de WhatsApp LID format
  evolution-api:
    build: ./evolution-api
    container_name: evolution-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "6543:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - QRCODE_LIMIT=30
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - bot-network

volumes:
  backend_data:
  evolution_instances:

networks:
  bot-network:
    driver: bridge
