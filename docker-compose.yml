services:

  # ── Bot backend ───────────────────────────────────────────────────────────────
  backend:
    build: .
    container_name: ${BOT_CONTAINER_NAME:-bot-restaurantes}
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=101
    volumes:
      - ${BACKEND_VOLUME:-backend_data}:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - bot-network

  # ── Elasticsearch ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.13.4}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - PUID=1000
      - PGID=101
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${ES_VOLUME:-es_data}:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - bot-network

  # ── ES setup: setea contraseña de kibana_system antes de arrancar Kibana ──────
  es-setup:
    image: alpine:3.19
    container_name: es-setup
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl --quiet
        echo "[es-setup] Seteando password de kibana_system..."
        RESP=$$(curl -s -o /tmp/out.txt -w "%{http_code}" \
          -u "elastic:$$ELASTIC_PASSWORD" \
          -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$ELASTIC_PASSWORD\"}")
        echo "[es-setup] HTTP $$RESP — $$(cat /tmp/out.txt)"
        exit 0
    networks:
      - bot-network

  # ── Kibana ────────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.13.4}
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - SERVER_NAME=${KIBANA_SERVER_NAME:-kibana}
      - SERVER_PUBLICBASEURL=${KIBANA_PUBLIC_URL:-http://localhost:5601}
      - LOGGING_ROOT_LEVEL=${KIBANA_LOG_LEVEL:-warn}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully
    networks:
      - bot-network

  # ── Kibana setup (corre una vez y termina) ───────────────────────────────────
  kibana-setup:
    image: alpine:3.19
    container_name: kibana-setup
    depends_on:
      - kibana
      - elasticsearch
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_INDEX_PATTERN=${KIBANA_INDEX_PATTERN:-bot-logs-*}
      - KIBANA_DATA_VIEW_ID=${KIBANA_DATA_VIEW_ID:-bot-logs}
      - KIBANA_DATA_VIEW_TITLE=${KIBANA_DATA_VIEW_TITLE:-Bot Logs}
    volumes:
      - ./kibana:/setup:ro
    command: ["/bin/sh", "/setup/setup.sh"]
    restart: "no"
    networks:
      - bot-network

  # ── Filebeat (log shipper) ────────────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.13.4}
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e --strict.perms=false
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - BOT_CONTAINER_NAME=${BOT_CONTAINER_NAME:-bot-restaurantes}
      - PUID=1000
      - PGID=101
    volumes:
      - ${FILEBEAT_VOLUME:-./filebeat}/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${FILEBEAT_VOLUME:-./filebeat}/ilm-policy.json:/usr/share/filebeat/ilm-policy.json:ro
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${FILEBEAT_VOLUME:-filebeat_data}:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
