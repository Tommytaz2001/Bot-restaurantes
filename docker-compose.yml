services:

  # ── Bot backend ───────────────────────────────────────────────────────────────
  backend:
    build: .
    container_name: ${BOT_CONTAINER_NAME:-bot-restaurantes}
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DATABASE_URL=postgresql://${DB_USER:-botuser}:${DB_PASSWORD:-botpassword}@postgres:5432/${DB_NAME:-botrestaurantes}
    volumes:
      # Datos internos del backend (cache, archivos temporales)
      - backend_data:/app/data
      # Comprobantes de pago subidos por clientes (imágenes)
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - bot-network

  # ── Base de datos PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bot-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-botuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-botpassword}
      - POSTGRES_DB=${DB_NAME:-botrestaurantes}
    volumes:
      # Datos persistentes de PostgreSQL (tablas, índices, WAL)
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización automática del esquema al crear la BD por primera vez
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-botuser} -d ${DB_NAME:-botrestaurantes}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  # ── Evolution API (WhatsApp via Baileys + REST) ──────────────────────────────
  # Imagen custom con patch para soporte de WhatsApp LID format
  evolution-api:
    build: ./evolution-api
    container_name: evolution-api
    restart: unless-stopped
    user: "root"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "6543:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - QRCODE_LIMIT=30
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - DEL_INSTANCE=false
    volumes:
      # Sesiones y claves de instancias de WhatsApp (QR, autenticación Baileys)
      - evolution_instances:/evolution/instances
    networks:
      - bot-network

# ── Volúmenes con bind mount para persistencia en despliegue ─────────────────
# Cada servicio añade su subcarpeta fija automáticamente a partir de volumen_ruta
# Por defecto usa la ruta relativa ./volumes
volumes:
  # Datos de PostgreSQL — tablas, índices y WAL
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${volumen_ruta:-./volumes}/postgres

  # Datos internos del backend
  backend_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${volumen_ruta:-./volumes}/backend

  # Imágenes de comprobantes de pago subidas por clientes
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${volumen_ruta:-./volumes}/uploads

  # Sesiones de instancias de Evolution API (WhatsApp)
  evolution_instances:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${volumen_ruta:-./volumes}/evolution

networks:
  bot-network:
    driver: bridge
