name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app-chef/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'URL del backend'
        required: false
        default: 'http://192.168.1.16:3001'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-chef

    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_RESTAURANTE_ID: urbano
      EXPO_PUBLIC_BACKEND_URL: ${{ github.event.inputs.backend_url || 'http://192.168.1.16:3001' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-chef/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r' > android/app/google-services.json

      - name: Verify google-services.json
        run: |
          echo "File size: $(wc -c < android/app/google-services.json) bytes"
          python3 -c "
          import json
          with open('android/app/google-services.json') as f:
              d = json.load(f)
          client = d['client'][0]
          info = client['client_info']
          pkg = info['android_client_info']['package_name']
          app_id = info.get('mobilesdk_app_id', 'MISSING')
          api_key = 'present' if client.get('api_key') else 'MISSING'
          print(f'Package name: {pkg}')
          print(f'mobilesdk_app_id: {app_id}')
          print(f'api_key: {api_key}')
          print('JSON is valid')
          "

      - name: Check google-services Gradle plugin
        run: |
          echo "=== android/build.gradle ==="
          grep -n "google-services" android/build.gradle || echo "google-services NOT FOUND in android/build.gradle"
          echo "=== android/app/build.gradle ==="
          grep -n "google-services" android/app/build.gradle || echo "google-services NOT FOUND in android/app/build.gradle"

      - name: Bundle JS (expo export:embed)
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file node_modules/expo-router/entry \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false

      - name: Build APK debug (firmado automáticamente)
        run: |
          cd android
          chmod +x gradlew
          SKIP_BUNDLING=true ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urbano-chef-${{ github.run_number }}
          path: app-chef/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
